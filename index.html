<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convenience Store Inventory Ledger</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <main class="container">
    <h1>Convenience Store Inventory Ledger</h1>
    <ul class="list-group" id="taskList">

    </ul>

    <h1>New Item To Be Added</h1>
    <div>
      <div class="m-2">
        <label>Item Description</label>
        <input type="text" id="name" class="form-control" />
      </div>
      <div class="m-2">
        <label>Entry Date</label>
        <input type="date" id="entryDate" class="form-control" />
      </div>
      <div class="m-2">
        <label></label>
        <select id="categorization" class="form-control">
          <option value="Beverages">Beverages</option>
          <option value="Read-To-Eat">Read-To-Eat</option>
          <option value="Snacks">Snacks</option>
          <option value="Fresh Food">Fresh Food</option>
          <option value="Tobaco">Tobaco</option>
        </select>

      </div>
      <button class="btn btn-primary m-2" id="addTodo">Create</button>
    </div>

  </main>

  <!-- SweetAlert -->
   <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- axios -->
   <script src="https://cdn.jsdelivr.net/npm/axios@1.16.0/dist/axios.min.js"></script>

  <!-- all global variables and functions are shared across javascript files -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>

</html>
